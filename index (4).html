<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gatitos y Corazones 3D</title>
<style>
:root{--bg:#fff0f5;--fg:#4a1030;--card:#fff;--ac:#e91e63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0b14;--fg:#ffd6e7;--card:#2a1220}}
:root[data-theme="dark"]{--bg:#1a0b14;--fg:#ffd6e7;--card:#2a1220}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px;user-select:none;touch-action:manipulation}
#hud{display:flex;gap:8px;font-weight:700;font-size:15px}
#hud span{background:var(--card);padding:5px 12px;border-radius:999px;border:2px solid var(--ac)}
#w{position:relative;width:min(100%,420px)}
#ov,#fin{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px;color:#4a1030}
#ov.menu{justify-content:space-between}
#ov h2{margin:0;font-size:28px;text-shadow:0 2px 0 #fff}#ov p{margin:0}
.card{background:rgba(255,255,255,.92);padding:20px;border-radius:18px;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.b{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 #a0124a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#fin{display:none;color:#fff;background:radial-gradient(ellipse at center,rgba(176,18,77,.6),transparent 72%);pointer-events:none}
#fin div{text-shadow:0 2px 0 #b0124d,0 0 12px #ff4081,0 0 26px #e91e63;font-weight:800;opacity:0;animation:pop .8s forwards}
#fin .t1{font-size:clamp(32px,10vw,46px);animation-delay:.3s}
#fin .t2{font-size:clamp(18px,5.6vw,26px);animation-delay:1.3s}
#fin .t3{font-size:26px;animation-delay:2.3s}
#fin button{pointer-events:auto;opacity:0;animation:pop .8s 3.2s forwards;margin-top:14px}
@keyframes pop{0%{opacity:0;transform:scale(.4)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:6px}
#pad button{background:var(--card);color:var(--fg);border:2px solid var(--ac);border-radius:14px;font-size:22px;touch-action:none}
</style></head><body>
<div id="hud"><span id="n">Nivel 1/3</span><span id="h">❤ 0/5</span><span id="g">🐾</span></div>
<div id="w"><div id="ov"></div><div id="fin"><div class="t1">Te amo Rowy 💖</div><div class="t2">Ya no estés enojada porfis 🥺</div><div class="t3">ATT Alex</div><button class="b" onclick="replay()">Jugar otra vez</button></div></div>
<div id="pad"><span></span><button data-d="u">▲</button><span></span><button data-d="l">◀</button><button data-d="d">▼</button><button data-d="r">▶</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,wrap=document.getElementById('w'),ov=document.getElementById('ov'),fin=document.getElementById('fin');
const NEED=[5,8,12],CATS={expreso:{name:'Expreso',col:0x25252f,eye:0x7cff3a},chetos:{name:'El Chetos',col:0xf5922a,eye:0x3aa655,st:0xc4620a}};
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.shadowMap.enabled=true;
const cvs=R.domElement;cvs.style.cssText='width:100%;display:block;border-radius:16px;border:3px solid #e91e63';wrap.insertBefore(cvs,ov);
const S=new T.Scene();S.background=new T.Color(0xffd6e7);S.fog=new T.Fog(0xffd6e7,24,48);
const cam=new T.PerspectiveCamera(45,.8,.1,100);cam.position.set(0,19,16);cam.lookAt(0,0,1.5);
function size(){const w=wrap.clientWidth,hh=w*1.25;R.setSize(w,hh,false);cam.aspect=w/hh;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();
S.add(new T.HemisphereLight(0xffffff,0xffb6d0,.95));
const sun=new T.DirectionalLight(0xffffff,.8);sun.position.set(6,15,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,far:50});S.add(sun);
const fc=document.createElement('canvas');fc.width=fc.height=64;const f2=fc.getContext('2d');f2.fillStyle='#ffeef5';f2.fillRect(0,0,64,64);f2.fillStyle='#ffd3e4';f2.fillRect(0,0,32,32);f2.fillRect(32,32,32,32);
const ft=new T.CanvasTexture(fc);ft.wrapS=ft.wrapT=T.RepeatWrapping;ft.repeat.set(10,13);
const fl=new T.Mesh(new T.PlaneGeometry(20,26),new T.MeshStandardMaterial({map:ft,roughness:.9}));fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;S.add(fl);
const wm=new T.MeshStandardMaterial({color:0xff7aa8,roughness:.5});
[[0,-13,20.6,.6],[0,13,20.6,.6],[-10,0,.6,26],[10,0,.6,26]].forEach(([x,z,w,d])=>{const b=new T.Mesh(new T.BoxGeometry(w,.8,d),wm);b.position.set(x,.4,z);b.castShadow=b.receiveShadow=true;S.add(b)});
function ad(g,geo,mat,x,y,z,sx=1,sy=1,sz=1){const o=new T.Mesh(geo,mat);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;g.add(o);return o}
function mkCat(c){const g=new T.Group(),m=new T.MeshStandardMaterial({color:c.col,roughness:.55}),pk=new T.MeshStandardMaterial({color:0xff9bb5}),ey=new T.MeshBasicMaterial({color:c.eye}),bk=new T.MeshBasicMaterial({color:0}),wh=new T.MeshBasicMaterial({color:0xffffff});
 ad(g,new T.SphereGeometry(.8,24,18),m,0,.85,0,1,.85,1.25);ad(g,new T.SphereGeometry(.65,24,18),m,0,1.6,.75);
 ad(g,new T.SphereGeometry(.08,10,8),pk,0,1.52,1.37);
 [-1,1].forEach(s=>{ad(g,new T.ConeGeometry(.24,.5,4),m,s*.38,2.15,.7).rotation.z=-s*.3;ad(g,new T.ConeGeometry(.12,.3,4),pk,s*.38,2.1,.78).rotation.z=-s*.3;
  ad(g,new T.SphereGeometry(.15,12,10),ey,s*.26,1.68,1.3,1,1.25,.5);ad(g,new T.SphereGeometry(.06,8,8),bk,s*.26,1.68,1.38,1,1.6,.5);ad(g,new T.SphereGeometry(.03,6,6),wh,s*.29,1.74,1.41);
  for(const z of[-.55,.55])ad(g,new T.CylinderGeometry(.15,.15,.55,10),m,s*.42,.28,z);
  for(const y of[-.05,.08])ad(g,new T.CylinderGeometry(.008,.008,.6,4),wh,s*.55,1.5+y,1.3).rotation.z=Math.PI/2+s*y*2});
 const tail=new T.Group();tail.position.set(0,.9,-.9);g.add(tail);
 const tm=new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(0,0,0),new T.Vector3(0,.3,-.55),new T.Vector3(.05,.95,-.65),new T.Vector3(.2,1.35,-.4)]),16,.12,8),m);tm.castShadow=true;tail.add(tm);
 if(c.st){const sm=new T.MeshStandardMaterial({color:c.st});[-.4,0,.4].forEach(z=>{const b=ad(g,new T.BoxGeometry(.6,.06,.13),sm,0,1.45-Math.abs(z)*.15,z);b.rotation.x=z*.3});[-.15,0,.15].forEach(x=>ad(g,new T.BoxGeometry(.06,.04,.2),sm,x,2.2,.8).rotation.x=-.3)}
 g.userData.tail=tail;return g}
function mkDog(){const g=new T.Group(),m=new T.MeshStandardMaterial({color:0xd9a066,roughness:.7}),d=new T.MeshStandardMaterial({color:0x8a5a2b,roughness:.7}),k=new T.MeshBasicMaterial({color:0x111111});
 ad(g,new T.SphereGeometry(.7,20,14),m,0,.75,0,1,.85,1.2);ad(g,new T.SphereGeometry(.55,20,14),m,0,1.35,.75);ad(g,new T.SphereGeometry(.28,16,12),d,0,1.2,1.2,1,.8,1);ad(g,new T.SphereGeometry(.09,10,8),k,0,1.3,1.46);
 [-1,1].forEach(s=>{ad(g,new T.SphereGeometry(.3,12,10),d,s*.5,1.45,.6,.5,1.1,.8);ad(g,new T.SphereGeometry(.07,8,8),k,s*.2,1.5,1.25);for(const z of[-.4,.4])ad(g,new T.CylinderGeometry(.13,.13,.45,8),d,s*.35,.22,z)});
 return g}
const hs=new T.Shape();hs.moveTo(0,-.7);hs.bezierCurveTo(-1.3,.2,-.55,1.05,0,.45);hs.bezierCurveTo(.55,1.05,1.3,.2,0,-.7);
const HG=new T.ExtrudeGeometry(hs,{depth:.3,bevelEnabled:true,bevelSize:.08,bevelThickness:.08,bevelSegments:3});HG.center();
const HM=new T.MeshStandardMaterial({color:0xff2e63,emissive:0x8a0030,roughness:.3});
function mkHeart(s,mat){const o=new T.Mesh(HG,mat||HM);o.scale.setScalar(s);o.castShadow=true;return o}
const cats={expreso:mkCat(CATS.expreso),chetos:mkCat(CATS.chetos)};Object.values(cats).forEach(c=>S.add(c));
const RM=[0xe91e63,0xff5c8a,0xff8fa3,0xd81b60,0xff1744].map(c=>new T.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.25,roughness:.3}));
const dir={u:0,d:0,l:0,r:0},KM={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){dir[k]=1;e.preventDefault()}});addEventListener('keyup',e=>{const k=KM[e.key];if(k)dir[k]=0});
document.querySelectorAll('#pad button').forEach(b=>{const d=b.dataset.d;b.addEventListener('pointerdown',e=>{dir[d]=1;e.preventDefault()});['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>dir[d]=0))});
let AC;function beep(f,d=.12,ty='sine'){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
let mode='menu',cur=null,lv=0,got=0,hearts=[],foes=[],fx=[],rain=[],inv=0,t=0,face=0;const P=new T.Vector3();
function show(html,cls){ov.className=cls||'';ov.innerHTML=html;ov.style.display='flex'}
function clear(){hearts.concat(rain,foes,fx).forEach(o=>S.remove(o));hearts=[];rain=[];foes=[];fx=[]}
function menu(){clear();mode='menu';fin.style.display='none';cats.expreso.visible=cats.chetos.visible=true;cur=null;
 show('<div><h2>🐾 Gatitos y Corazones</h2><p>Elige a tu gatito y junta todos los corazones</p></div><div><div class="row"><button class="b" onclick="start(\'expreso\')">🐈‍⬛ Expreso</button><button class="b" onclick="start(\'chetos\')">🐱 El Chetos</button></div><p style="font-size:13px;margin-top:8px">Flechas / WASD o botones. ¡Cuidado con los perritos!</p></div>','menu')}
function start(k){cur=cats[k];Object.values(cats).forEach(c=>c.visible=c===cur);lv=0;document.getElementById('g').textContent='🐾 '+CATS[k].name;begin()}
function begin(){clear();got=0;inv=0;P.set(0,0,10);face=Math.PI;cur.rotation.y=face;
 for(let i=0;i<lv;i++){const f=mkDog();f.position.set(-6+i*10,0,-8+Math.random()*4);f.userData={vx:(i%2?-1:1)*(3+lv*1.2),vz:2.5+lv*1.1};S.add(f);foes.push(f)}
 spawn();spawn();mode='play';ov.style.display='none';hud()}
function spawn(){const o=mkHeart(.6);o.position.set(-8+Math.random()*16,1.4,-11+Math.random()*19);S.add(o);hearts.push(o)}
function hud(){n.textContent='Nivel '+(lv+1)+'/3';h.textContent='❤ '+got+'/'+NEED[lv]}
function pop(p){for(let i=0;i<7;i++){const o=mkHeart(.2,RM[i%5]);o.position.copy(p);o.userData={v:new T.Vector3((Math.random()-.5)*6,2+Math.random()*3,(Math.random()-.5)*6),life:.7};S.add(o);fx.push(o)}}
function lvDone(){beep(1046,.3);if(lv>=2){final();return}mode='between';show('<div class="card"><h2>🎉 ¡Nivel '+(lv+1)+' superado!</h2><p>'+CATS[cur===cats.expreso?'expreso':'chetos'].name+' juntó todos los corazones</p><button class="b" onclick="lv++;begin()">Siguiente nivel</button></div>')}
function final(){clear();mode='end';for(let i=0;i<70;i++){const o=mkHeart(.35+Math.random()*.6,RM[i%5]);o.position.set(-14+Math.random()*28,Math.random()*18,-12+Math.random()*22);o.userData={v:2+Math.random()*3,s:1+Math.random()*2};S.add(o);rain.push(o)}
 [660,784,988,1318].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*160));ov.style.display='none';fin.style.display='flex'}
function replay(){menu()}
const cl=(v,a)=>Math.max(-a,Math.min(a,v));let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
 if(mode==='menu'){Object.values(cats).forEach((c,i)=>{c.position.set(i?3.2:-3.2,Math.abs(Math.sin(t*2+i))*.15,5);c.rotation.y=Math.sin(t*1.5+i)*.4;c.userData.tail.rotation.y=Math.sin(t*5+i)*.4})}
 else if(mode==='play'){const dx=dir.r-dir.l,dz=dir.d-dir.u,mv=dx||dz;
  if(mv){const l=Math.hypot(dx,dz);P.x=cl(P.x+dx/l*7*dt,9);P.z=cl(P.z+dz/l*7*dt,12);let df=Math.atan2(dx,dz)-face;df=Math.atan2(Math.sin(df),Math.cos(df));face+=df*Math.min(1,dt*12)}
  cur.position.set(P.x,mv?Math.abs(Math.sin(t*14))*.12:0,P.z);cur.rotation.y=face;cur.userData.tail.rotation.y=Math.sin(t*6)*.4;
  inv=Math.max(0,inv-dt);cur.visible=!(inv>0&&Math.floor(t*12)%2);
  for(let i=hearts.length-1;i>=0;i--){const o=hearts[i];o.rotation.y+=dt*2.5;o.position.y=1.4+Math.sin(t*3+i)*.2;
   if(Math.hypot(o.position.x-P.x,o.position.z-P.z)<1.6){S.remove(o);hearts.splice(i,1);got++;pop(o.position);beep(880+got*40);hud();if(got>=NEED[lv]){lvDone();break}spawn()}}
  foes.forEach(f=>{const u=f.userData;f.position.x+=u.vx*dt;f.position.z+=u.vz*dt;if(Math.abs(f.position.x)>8.5)u.vx*=-1;if(Math.abs(f.position.z)>11.5)u.vz*=-1;
   f.rotation.y=Math.atan2(u.vx,u.vz);f.position.y=Math.abs(Math.sin(t*10))*.1;
   if(!inv&&Math.hypot(f.position.x-P.x,f.position.z-P.z)<1.8){inv=1.2;if(got>0)got--;beep(180,.25,'square');hud()}})}
 else if(mode==='end'){cur.position.set(0,Math.abs(Math.sin(t*5))*1.3,6);cur.rotation.y=Math.sin(t*2)*.5;cur.userData.tail.rotation.y=Math.sin(t*9)*.5;
  rain.forEach(o=>{o.position.y-=o.userData.v*dt;if(o.position.y<-1)o.position.y=16;o.rotation.y+=dt*o.userData.s})}
 for(let i=fx.length-1;i>=0;i--){const o=fx[i],u=o.userData;u.life-=dt;u.v.y-=9*dt;o.position.addScaledVector(u.v,dt);o.scale.setScalar(Math.max(.001,u.life*.3));if(u.life<=0){S.remove(o);fx.splice(i,1)}}
 R.render(S,cam);requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
